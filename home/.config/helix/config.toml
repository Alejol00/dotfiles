theme = "gruvbox"

[editor]
line-number = "relative"
mouse = true
auto-format = true
completion-trigger-len = 1
cursorline = true
true-color = true
clipboard-provider = "wayland"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[keys.normal]
space.space = "file_picker"
space.w = ":w"
space.q = ":q"

