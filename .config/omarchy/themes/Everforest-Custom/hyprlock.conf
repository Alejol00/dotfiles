background {
    monitor =
    path = ~/.config/omarchy/current/background
    blur_passes = 4
    blur_size = 10
    noise = 0.02
    contrast = 1.05
    brightness = 0.82
    vibrancy = 0.12
    vibrancy_darkness = 0.0
}

general {
    hide_cursor = true
    grace = 0
}

input-field {
    monitor =
    size = 320, 58
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(a7c080)
    inner_color = rgba(30, 30, 30, 0.55)
    font_color = rgb(d3c6aa)
    fade_on_empty = false
    rounding = 18
    placeholder_text = <i>Escribí tu contraseña...</i>
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgb(d3c6aa)
    font_size = 72
    font_family = Sans Bold
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgb(9da9a0)
    font_size = 20
    font_family = Sans
    position = 0, 70
    halign = center
    valign = center
}
